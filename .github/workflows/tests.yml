name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          # Each Laravel line only on the PHP versions it officially supports.
          - { laravel: '10.*', php: '8.4' }
          - { laravel: '10.*', php: '8.5' }
          - { laravel: '11.*', php: '8.5' }
          - { laravel: '13.*', php: '8.2' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (setup-php v2.40.0)
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel 10 and 11 are end of life and carry unpatched advisories, so
      # Composer's install-time blocking is off; the audit step below still
      # fails the build for the supported Laravel lines.
      - name: Install dependencies
        run: composer update --with "laravel/framework:${{ matrix.laravel }}" --no-interaction --prefer-dist --no-security-blocking

      - name: Audit dependencies for known vulnerabilities
        if: matrix.laravel == '12.*' || matrix.laravel == '13.*'
        run: composer audit

      - name: Run tests
        run: ./vendor/bin/pest
